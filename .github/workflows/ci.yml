# Thin wrapper: the checks live in the justfile (`just check`, `just smoke`).
name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 9 * * *" # daily: catches drift in CopilotKit or Sectr, not just in this repo

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: extractions/setup-just@v3
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: astral-sh/setup-uv@v6
      - run: just check

  # Against the live demo agent (`agent/`, deployed on Sectr). Needs the repo
  # secrets below, so it is skipped on forks.
  smoke:
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v4
      - uses: extractions/setup-just@v3
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: just smoke
        env:
          SECTR_AGUI_URL: ${{ secrets.SECTR_AGUI_URL }}
          SECTR_INVOCATION_KEY: ${{ secrets.SECTR_INVOCATION_KEY }}
