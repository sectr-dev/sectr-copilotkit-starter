name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 9 * * *" # daily: catches drift in CopilotKit or Sectr, not just in this repo

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
        env:
          SECTR_AGUI_URL: https://api.sectr.dev/ag-ui/support-agent/chat_oai

  # Against the live demo agent (`agent/`, deployed on Sectr). Needs the repo
  # secrets below, so it is skipped on forks.
  smoke:
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run smoke
        env:
          SECTR_AGUI_URL: ${{ secrets.SECTR_AGUI_URL }}
          SECTR_INVOCATION_KEY: ${{ secrets.SECTR_INVOCATION_KEY }}
